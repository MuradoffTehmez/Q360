{% extends 'layouts/base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block title %}{% trans "Qeydiyyat" %}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h4 class="mb-0">{% trans "Qeydiyyat" %}</h4>
        </div>
        <div class="card-body">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">{% trans "Qeydiyyatdan keç" %}</button>
            </div>
          </form>
          
          <div class="text-center mt-3">
            <p>{% trans "Artıq hesabınız var?" %} <a href="{% url 'login' %}">{% trans "Daxil ol" %}</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
